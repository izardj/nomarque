name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, test and build affected projects
    runs-on: ubuntu-latest
    services:
      # Backing services used by integration tests in upcoming milestones.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nomarque
          POSTGRES_PASSWORD: nomarque
          POSTGRES_DB: nomarque
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://nomarque:nomarque@localhost:5432/nomarque?schema=public
      REDIS_URL: redis://localhost:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so Nx can diff against the base commit.
          fetch-depth: 0

      # The pnpm version comes from the `packageManager` field, never declared here.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Derives the Nx base and head SHAs from the triggering event.
      - name: Set Nx SHAs
        uses: nrwl/nx-set-shas@v4

      - name: Lint, test and build affected projects
        run: pnpm nx affected -t lint test build --parallel=3
