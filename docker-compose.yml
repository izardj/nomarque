# Local infrastructure and application images for Nomarque.
# Infrastructure (postgres, redis, mailpit) starts with `docker compose up -d`;
# application services (api, worker, web) require `--profile app`.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nomarque}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nomarque}
      POSTGRES_DB: ${POSTGRES_DB:-nomarque}
    ports:
      # Host port 5433 by default to avoid clashing with a local PostgreSQL.
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-nomarque} -d ${POSTGRES_DB:-nomarque}',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      # Host port 6380 by default to avoid clashing with a local Redis.
      - '${REDIS_PORT:-6380}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Catches every outgoing e-mail locally; nothing is delivered.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'

  api:
    profiles: ['app']
    build:
      context: .
      dockerfile: docker/node-app.Dockerfile
      args:
        APP: api
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside the Compose network, services are reached by service name.
      DATABASE_URL: postgresql://${POSTGRES_USER:-nomarque}:${POSTGRES_PASSWORD:-nomarque}@postgres:5432/${POSTGRES_DB:-nomarque}?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      - '${API_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    profiles: ['app']
    build:
      context: .
      dockerfile: docker/node-app.Dockerfile
      args:
        APP: worker
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside the Compose network, services are reached by service name.
      DATABASE_URL: postgresql://${POSTGRES_USER:-nomarque}:${POSTGRES_PASSWORD:-nomarque}@postgres:5432/${POSTGRES_DB:-nomarque}?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    profiles: ['app']
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
  redisdata:
