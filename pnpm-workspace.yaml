packages:
  - 'apps/*'
  - 'libs/*'

allowBuilds:
  # Downloads the schema engine used by prisma migrate.
  '@prisma/engines': true
  prisma: true
  '@parcel/watcher': true
  '@swc/core': true
  nx: true
  unrs-resolver: false
  '@nestjs/core': false
  esbuild: false
  lmdb: false
  msgpackr-extract: false
