<main class="page">
  <h1>{{ t.title }}</h1>
  <p class="secondary">{{ t.intro }}</p>

  @if (status() !== 'sent') {
  <form class="page" novalidate [formGroup]="form" (ngSubmit)="submit()">
    <div class="field">
      <label class="field__label" for="login-email">{{ t.emailLabel }}</label>
      <input
        id="login-email"
        class="field__input"
        type="email"
        inputmode="email"
        autocomplete="email"
        formControlName="email"
        [attr.aria-invalid]="error() ? 'true' : null"
        aria-describedby="login-feedback"
      />
    </div>
    <button
      class="btn btn--primary"
      type="submit"
      [disabled]="status() === 'sending'"
    >
      {{ status() === 'sending' ? t.sending : t.submit }}
    </button>
  </form>
  }

  <div id="login-feedback" aria-live="polite">
    @if (error(); as message) {
    <p class="message message--error">{{ message }}</p>
    } @if (status() === 'sent') {
    <p class="surface message message--success">{{ t.sent }}</p>
    }
  </div>
</main>
